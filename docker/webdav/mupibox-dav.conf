# The WebDAV "NAS" of the dev container: /data is served by mod_dav behind Basic auth, the credentials are
# mupibox/mupibox (conf/htpasswd, created in the Dockerfile). Included at the end of httpd.conf, so the
# DocumentRoot here wins over the default htdocs.
#
# What the box's WebDAV client needs comes with mod_dav_fs and the core: PROPFIND with Depth 1 lists a folder with
# getetag and getlastmodified for every entry, GET honours Range (206), and the MIME type (getcontenttype) is
# taken from conf/mime.types.
DocumentRoot "/data"
DavLockDB "/var/lib/dav/DavLock"

<Directory "/data">
    Dav On
    Options Indexes
    AllowOverride None
    AuthType Basic
    AuthName "MuPiBox dev NAS"
    AuthUserFile "conf/htpasswd"
    Require valid-user
</Directory>
